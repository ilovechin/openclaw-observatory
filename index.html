<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenClaw 实时监控面板</title>
  <style>
    :root{
      --bg:#070b18; --bg2:#0d1530; --panel:#0e1a3a; --line:#2d3f78;
      --text:#eaf2ff; --muted:#9db0dd; --green:#54e3a4; --red:#ff7f88; --cyan:#5bc4ff;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,"PingFang SC",Arial;color:var(--text);
      background:radial-gradient(circle at 8% 0%, #182f67 0%, transparent 25%),
                 radial-gradient(circle at 92% 0%, #3b1c58 0%, transparent 22%),
                 linear-gradient(180deg,var(--bg),var(--bg2));}
    .wrap{max-width:1350px;margin:0 auto;padding:18px}
    header{position:sticky;top:0;z-index:20;background:rgba(6,10,23,.75);backdrop-filter:blur(10px);border-bottom:1px solid #273a71}
    .bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .title{font-size:32px;font-weight:800;letter-spacing:.3px}
    .sub{font-size:13px;color:var(--muted)}
    .btn{border:1px solid #2c4280;background:#12214b;color:#dff0ff;padding:8px 12px;border-radius:10px;font-size:12px;text-decoration:none}

    .kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:14px}
    .kpi{background:linear-gradient(160deg,#122352,#0d1a3c);border:1px solid #2a3f78;border-radius:12px;padding:12px 14px}
    .k{font-size:12px;color:#9fb5e5}
    .v{margin-top:6px;font-size:24px;font-weight:700}

    .board{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
    .card{background:linear-gradient(165deg,#10224e,#0b1635);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(91,196,255,.07) inset}
    .head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #253a70;background:linear-gradient(90deg,rgba(91,196,255,.09),rgba(255,127,136,.06))}
    .head h3{margin:0;font-size:16px}
    .pill{font-size:11px;border:1px solid #395ca6;padding:3px 8px;border-radius:999px;color:#cbe0ff}

    table{width:100%;border-collapse:collapse}
    th,td{padding:10px 12px;border-bottom:1px solid #1f315f;font-size:13px;text-align:left}
    th{color:#acc2f2;font-weight:600;background:rgba(19,40,86,.35)}
    td{color:#e5edff}
    tr:hover td{background:rgba(35,66,130,.22)}

    .ok{color:var(--green);font-weight:700}
    .bad{color:var(--red);font-weight:700}
    .idle{color:#aab6d8}
    .small{font-size:12px;color:var(--muted)}

    .full{margin-top:14px}
    @media (max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div class="wrap bar">
      <div>
        <div class="title">OpenClaw 全量监控面板</div>
        <div class="sub">系统状态 · Token 用量 · 定时任务 · 历史趋势 · 最后更新：<span id="ts">-</span></div>
      </div>
      <a class="btn" href="./data/current.json" target="_blank">刷新数据 / 原始JSON</a>
    </div>
  </header>

  <main class="wrap">
    <section class="kpi-grid" id="kpis"></section>

    <section class="board">
      <div class="card">
        <div class="head"><h3>任务运行看板</h3><span class="pill">CRON STATUS</span></div>
        <table id="cron">
          <thead><tr><th>任务</th><th>状态</th><th>下次运行</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card">
        <div class="head"><h3>Token 历史快照</h3><span class="pill">USAGE HISTORY</span></div>
        <table id="hist">
          <thead><tr><th>时间</th><th>模型</th><th>5h已用</th><th>Day已用</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card full">
      <div class="head"><h3>系统健康摘要</h3><span class="pill">HEALTH SUMMARY</span></div>
      <table>
        <thead><tr><th>项</th><th>值</th><th>说明</th></tr></thead>
        <tbody id="summary"></tbody>
      </table>
    </section>
  </main>

  <script>
    function fmtTs(ms){
      if(!ms) return '-';
      const n = Number(ms);
      if(Number.isNaN(n)) return String(ms);
      return new Date(n).toLocaleString();
    }

    async function load(){
      const c = await fetch('./data/current.json?t='+Date.now()).then(r=>r.json());
      const h = await fetch('./data/history.json?t='+Date.now()).then(r=>r.json()).catch(()=>[]);
      document.getElementById('ts').textContent = new Date(c.generatedAt).toLocaleString();

      const provider = (c.usage?.providers||[])[0] || {};
      const wins = provider.windows || [];
      const w5 = wins[0]?.usedPercent;
      const day = wins[1]?.usedPercent;

      const k = [
        ['当前模型', c.model || '-'],
        ['5h 用量', w5!=null ? w5+'%' : '-'],
        ['Day 用量', day!=null ? day+'%' : '-'],
        ['Gateway', c.gatewayOk ? '正常' : '异常'],
        ['Memory 检索', c.memoryReady ? '可用' : '不可用'],
        ['任务总数', String((c.cronJobs||[]).length)]
      ];
      document.getElementById('kpis').innerHTML = k.map(x => `<div class='kpi'><div class='k'>${x[0]}</div><div class='v'>${x[1]}</div></div>`).join('');

      document.querySelector('#cron tbody').innerHTML = (c.cronJobs||[]).map(j => {
        const st = (j.status || 'idle').toLowerCase();
        const cls = st === 'ok' ? 'ok' : (st === 'idle' ? 'idle' : 'bad');
        return `<tr><td>${j.name}</td><td class='${cls}'>${j.status||'idle'}</td><td>${fmtTs(j.next)}</td></tr>`;
      }).join('');

      document.querySelector('#hist tbody').innerHTML = (h.slice(-20).reverse()).map(r =>
        `<tr><td>${new Date(r.generatedAt).toLocaleString()}</td><td>${r.model||'-'}</td><td>${r.w5 ?? '-'}</td><td>${r.day ?? '-'}</td></tr>`
      ).join('');

      const summary = [
        ['Provider', provider.provider || '-', '当前计费/配额来源'],
        ['Plan', provider.plan || '-', '平台返回的套餐信息'],
        ['更新周期', '每 10 分钟', '由 observability-snapshot-publish 定时更新'],
        ['数据来源', 'OpenClaw CLI JSON', 'status/memory/cron 聚合快照']
      ];
      document.getElementById('summary').innerHTML = summary.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td class='small'>${x[2]}</td></tr>`).join('');
    }

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
