<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>监控中枢 · Apple B/W Pro</title>
  <style>
    :root{
      --bg:#0a0a0b;
      --bg-soft:#121214;
      --card:rgba(255,255,255,.06);
      --card-strong:rgba(255,255,255,.1);
      --line:rgba(255,255,255,.14);
      --text:#f5f5f7;
      --muted:#a1a1a6;
      --ok:#34c759;
      --warn:#ffd60a;
      --bad:#ff453a;
      --pill:#1c1c1e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:radial-gradient(1200px 700px at 85% -10%,#262628 0%,transparent 50%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Segoe UI,Arial,sans-serif}
    .wrap{max-width:1400px;margin:0 auto;padding:20px}
    .top{position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);background:rgba(10,10,11,.7);border-bottom:1px solid var(--line)}
    .top-inner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;max-width:1400px;margin:0 auto}
    .title{font-size:30px;font-weight:700;letter-spacing:.2px}
    .sub{font-size:12px;color:var(--muted);margin-top:4px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:var(--pill);color:var(--text);padding:8px 12px;border-radius:999px;font-size:12px;text-decoration:none}

    .grid{display:grid;gap:12px}
    .kpis{grid-template-columns:repeat(6,minmax(0,1fr));margin-top:16px}
    .main{grid-template-columns:1.3fr 1fr;margin-top:12px}
    .triple{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px}

    .card{background:linear-gradient(180deg,var(--card),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
    .card-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
    .card-h h3{margin:0;font-size:14px;font-weight:600}
    .tag{font-size:11px;color:#d6d6db;background:var(--pill);border:1px solid var(--line);padding:4px 8px;border-radius:999px}
    .card-b{padding:14px 16px}

    .kpi{padding:14px 16px}
    .k-label{font-size:12px;color:var(--muted)}
    .k-value{font-size:24px;font-weight:700;margin-top:8px;word-break:break-word}
    .state-ok{color:var(--ok)} .state-warn{color:var(--warn)} .state-bad{color:var(--bad)}

    .progress{height:10px;background:#1b1b1f;border-radius:999px;border:1px solid var(--line);overflow:hidden}
    .progress > i{display:block;height:100%;background:linear-gradient(90deg,#fff,#8e8e93)}

    table{width:100%;border-collapse:collapse}
    th,td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:12px}
    th{color:var(--muted);font-weight:600}

    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--pill);font-size:12px}

    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;color:#d6d6db;background:#0e0e10;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:280px;overflow:auto}
    canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#0f0f11}

    @media(max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.main{grid-template-columns:1fr}.triple{grid-template-columns:1fr}}
    @media(max-width:740px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.title{font-size:24px}.wrap{padding:14px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <div class="title">监控中枢 · Apple B/W Pro</div>
        <div class="sub">黑白苹果风豪华版 · 更新时间：<span id="updatedAt">-</span></div>
      </div>
      <div class="toolbar">
        <a class="btn" href="./data/current.json" target="_blank">Current JSON</a>
        <a class="btn" href="./data/history.json" target="_blank">History JSON</a>
        <button class="btn" id="refreshBtn">刷新</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="grid kpis" id="kpis"></section>

    <section class="grid main">
      <article class="card">
        <div class="card-h"><h3>任务看板</h3><span class="tag">CRON</span></div>
        <div class="card-b">
          <table>
            <thead><tr><th>任务</th><th>状态</th><th>错误</th><th>下次运行</th></tr></thead>
            <tbody id="cronBody"></tbody>
          </table>
        </div>
      </article>

      <article class="card">
        <div class="card-h"><h3>系统健康</h3><span class="tag">HEALTH</span></div>
        <div class="card-b">
          <div class="chips" id="healthChips"></div>
          <div style="height:12px"></div>
          <div class="k-label">5h Token 使用率</div>
          <div class="progress" style="margin-top:6px"><i id="bar5"></i></div>
          <div class="k-label" id="txt5" style="margin-top:8px">-</div>
          <div style="height:10px"></div>
          <div class="k-label">Week/Day Token 使用率</div>
          <div class="progress" style="margin-top:6px"><i id="barDay"></i></div>
          <div class="k-label" id="txtDay" style="margin-top:8px">-</div>
        </div>
      </article>
    </section>

    <section class="grid triple">
      <article class="card">
        <div class="card-h"><h3>Token 趋势</h3><span class="tag">TREND</span></div>
        <div class="card-b"><canvas id="tokenChart" width="560" height="250"></canvas></div>
      </article>
      <article class="card">
        <div class="card-h"><h3>资源趋势</h3><span class="tag">MEM/DISK</span></div>
        <div class="card-b"><canvas id="resChart" width="560" height="250"></canvas></div>
      </article>
      <article class="card">
        <div class="card-h"><h3>配置摘要</h3><span class="tag">MODEL</span></div>
        <div class="card-b"><pre class="mono" id="summary"></pre></div>
      </article>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function num(v, d=0){ const n=Number(v); return Number.isFinite(n)?n:d; }
    function pct(v){ return `${num(v).toFixed(0)}%`; }
    function dt(v){ if(!v) return '-'; const t=Number(v); return Number.isFinite(t)?new Date(t).toLocaleString():String(v); }

    function stateClass(s){
      const x=(s||'').toLowerCase();
      if(x==='ok' || x==='healthy') return 'state-ok';
      if(x==='idle' || x==='warn' || x==='warning') return 'state-warn';
      return 'state-bad';
    }

    function kpiCard(label, value, cls=''){
      return `<div class="card kpi"><div class="k-label">${label}</div><div class="k-value ${cls}">${value}</div></div>`;
    }

    function drawLine(canvasId, valuesA=[], valuesB=[], colorA='#f5f5f7', colorB='#8e8e93', maxY=100){
      const c=$(canvasId); if(!c) return;
      const ctx=c.getContext('2d');
      const w=c.width, h=c.height, p=24;
      ctx.clearRect(0,0,w,h);

      ctx.strokeStyle='rgba(255,255,255,.12)';
      for(let i=0;i<5;i++){
        const y=p+(h-p*2)*(i/4);
        ctx.beginPath(); ctx.moveTo(p,y); ctx.lineTo(w-p,y); ctx.stroke();
      }

      function plot(arr,color){
        if(!arr.length) return;
        ctx.strokeStyle=color; ctx.lineWidth=2;
        ctx.beginPath();
        arr.forEach((v,i)=>{
          const x=p+(w-p*2)*(arr.length===1?0:i/(arr.length-1));
          const y=h-p-(Math.min(maxY,Math.max(0,v))/maxY)*(h-p*2);
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
      }

      plot(valuesA, colorA);
      plot(valuesB, colorB);
    }

    function buildKpis(cur){
      const model = cur?.identity?.model || '-';
      const gw = !!cur?.openclaw?.gatewayOk;
      const mem = num(cur?.system?.memory?.usedPct);
      const disk = num(String(cur?.system?.diskRoot?.usedPct || '0').replace('%',''));
      const jobs = Array.isArray(cur?.openclaw?.cronJobs) ? cur.openclaw.cronJobs : [];
      const badJobs = jobs.filter(j => (j.status||'').toLowerCase() !== 'ok').length;
      const five = num(cur?.usageQuick?.fiveHourUsedPct);
      const day = num(cur?.usageQuick?.dayUsedPct);

      $('kpis').innerHTML = [
        kpiCard('当前模型', model),
        kpiCard('Gateway', gw?'在线':'异常', gw?'state-ok':'state-bad'),
        kpiCard('Cron 任务', String(jobs.length)),
        kpiCard('异常任务', String(badJobs), badJobs? 'state-bad':'state-ok'),
        kpiCard('内存占用', pct(mem), mem>80?'state-bad':mem>65?'state-warn':'state-ok'),
        kpiCard('磁盘占用', pct(disk), disk>85?'state-bad':disk>70?'state-warn':'state-ok')
      ].join('');

      $('bar5').style.width = Math.min(100,five) + '%';
      $('barDay').style.width = Math.min(100,day) + '%';
      $('txt5').textContent = `${five}% used`;
      $('txtDay').textContent = `${day}% used`;
    }

    function buildCron(cur){
      const rows = (cur?.openclaw?.cronJobs || []).slice().sort((a,b)=> num(a.next)-num(b.next)).slice(0,14).map(j=>{
        return `<tr>
          <td>${j.name||j.id||'-'}</td>
          <td class="${stateClass(j.status)}">${j.status||'-'}</td>
          <td>${num(j.errors)}</td>
          <td>${dt(j.next)}</td>
        </tr>`;
      }).join('');
      $('cronBody').innerHTML = rows || '<tr><td colspan="4">暂无任务</td></tr>';
    }

    function buildHealth(cur){
      const mem = num(cur?.system?.memory?.usedPct);
      const disk = num(String(cur?.system?.diskRoot?.usedPct||'0').replace('%',''));
      const load1 = num(cur?.system?.load?.['1m']);
      const chips = [
        `Gateway: ${cur?.openclaw?.gatewayOk ? 'OK':'BAD'}`,
        `Memory: ${pct(mem)}`,
        `Disk: ${pct(disk)}`,
        `Load1m: ${load1.toFixed(2)}`,
        `Model: ${(cur?.identity?.provider||'-')}`
      ];
      $('healthChips').innerHTML = chips.map(c=>`<span class="chip">${c}</span>`).join('');
    }

    function buildSummary(cur){
      const txt = {
        identity: cur?.identity || {},
        usageQuick: cur?.usageQuick || {},
        load: cur?.system?.load || {},
        process: cur?.system?.processCounts || {},
        channelSummary: cur?.openclaw?.channelSummary || []
      };
      $('summary').textContent = JSON.stringify(txt, null, 2);
    }

    function buildCharts(hist){
      const list = (Array.isArray(hist)?hist:[]).slice(-28);
      const w5 = list.map(x=>num(x.w5));
      const day = list.map(x=>num(x.day));
      const mem = list.map(x=>num(x.memUsedPct));
      const disk = list.map(x=>num(String(x.diskUsedPct||'0').replace('%','')));
      drawLine('tokenChart', w5, day, '#f5f5f7', '#8e8e93', 100);
      drawLine('resChart', mem, disk, '#d1d1d6', '#636366', 100);
    }

    async function load(){
      try{
        const [curR, histR] = await Promise.all([
          fetch('./data/current.json?t='+Date.now()),
          fetch('./data/history.json?t='+Date.now())
        ]);
        const cur = await curR.json();
        const hist = await histR.json();

        $('updatedAt').textContent = cur?.generatedAt ? new Date(cur.generatedAt).toLocaleString() : '-';
        buildKpis(cur);
        buildCron(cur);
        buildHealth(cur);
        buildSummary(cur);
        buildCharts(hist);
      } catch (e) {
        $('summary').textContent = '加载失败: ' + e;
      }
    }

    $('refreshBtn').addEventListener('click', load);
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
